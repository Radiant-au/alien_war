<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 64" width="512" height="64">
  <defs>
    <!-- Reusable Plasma Core & Flash Base -->
    <g id="electric-core-base">
      <!-- Intense Yellow-White Leading Electrical Discharge -->
      <polygon points="76,15 98,13 118,32 98,51 76,49 84,32" fill="#FFFFCC" />
    </g>
  </defs>

  <!-- ==================== FRAME 1 (0 to 128) ==================== -->
  <g transform="translate(0, 0)">
    <!-- Detached Electrical Arcs and Ionized Sparks -->
    <polygon points="6,25 12,18 16,28 10,34" fill="#00FFFF" />
    <polygon points="20,13 28,9 22,20 15,16" fill="#CCFFFF" />
    <polygon points="18,52 26,45 32,53 24,56" fill="#00FFFF" />

    <!-- Outer Jagged Blue Lightning Aura -->
    <polygon points="124,32 104,12 68,15 44,4 58,16 20,15 46,27 6,32 46,37 20,49 58,48 44,60 68,49 104,52" fill="#0033CC" />
    
    <!-- Mid Cyan Spark/Discharge Layer -->
    <polygon points="119,32 100,16 72,18 52,10 63,19 32,20 52,29 20,32 52,35 32,44 63,45 52,54 72,46 100,48" fill="#00FFFF" />

    <!-- Plasma High-Voltage Core -->
    <use href="#electric-core-base" />

    <!-- Strange Dark Plasma/Energy Void -->
    <polygon points="113,32 96,22 74,22 58,17 68,26 44,28 62,32 44,36 68,38 58,47 74,42 96,42" fill="#1C0A35" />
    <!-- Core Ionized Nucleus -->
    <polygon points="88,32 95,24 105,32 95,40" fill="#FFFF00" />
  </g>

  <!-- ==================== FRAME 2 (128 to 256) ==================== -->
  <g transform="translate(128, 0)">
    <!-- Detached Electrical Arcs (Shifted/Crashing) -->
    <polygon points="4,34 10,24 18,31 8,40" fill="#00FFFF" />
    <polygon points="15,48 24,42 28,52 18,55" fill="#CCFFFF" />
    <polygon points="25,12 34,7 28,19 19,16" fill="#00FFFF" />

    <!-- Outer Jagged Blue Lightning Aura -->
    <polygon points="124,32 104,13 68,16 38,3 54,16 14,19 42,29 12,32 42,35 14,45 54,48 38,61 68,48 104,51" fill="#0033CC" />
    
    <!-- Mid Cyan Spark/Discharge Layer -->
    <polygon points="119,32 100,17 72,19 46,9 58,19 26,23 48,31 26,32 48,33 26,41 58,45 46,55 72,45 100,47" fill="#00FFFF" />

    <!-- Plasma High-Voltage Core -->
    <use href="#electric-core-base" />

    <!-- Strange Dark Plasma/Energy Void -->
    <polygon points="113,32 96,21 74,21 52,15 65,25 46,29 58,32 46,35 65,39 52,49 74,43 96,43" fill="#1C0A35" />
    <polygon points="87,32 94,23 103,32 94,41" fill="#FFFF00" />
  </g>

  <!-- ==================== FRAME 3 (256 to 384) ==================== -->
  <g transform="translate(256, 0)">
    <!-- Detached Electrical Arcs -->
    <polygon points="8,40 14,31 20,41 12,48" fill="#00FFFF" />
    <polygon points="12,14 19,7 24,15 16,21" fill="#00FFFF" />
    <polygon points="21,54 30,47 34,57 26,60" fill="#CCFFFF" />

    <!-- Outer Jagged Blue Lightning Aura -->
    <polygon points="124,32 104,11 68,14 48,7 58,18 24,11 44,26 4,32 44,38 24,53 58,46 48,57 68,50 104,53" fill="#0033CC" />
    
    <!-- Mid Cyan Spark/Discharge Layer -->
    <polygon points="119,32 100,15 72,17 54,13 64,21 34,17 50,28 18,32 50,36 34,47 64,43 54,51 72,47 100,49" fill="#00FFFF" />

    <!-- Plasma High-Voltage Core -->
    <use href="#electric-core-base" />

    <!-- Strange Dark Plasma/Energy Void -->
    <polygon points="113,32 96,23 74,23 58,20 68,27 38,25 62,32 38,39 68,37 58,44 74,41 96,41" fill="#1C0A35" />
    <polygon points="89,32 96,25 106,32 96,39" fill="#FFFF00" />
  </g>

  <!-- ==================== FRAME 4 (384 to 512) ==================== -->
  <g transform="translate(384, 0)">
    <!-- Detached Electrical Arcs -->
    <polygon points="5,20 11,13 16,22 10,27" fill="#CCFFFF" />
    <polygon points="11,53 18,46 22,55 14,58" fill="#00FFFF" />
    <polygon points="22,30 29,22 34,32 27,37" fill="#00FFFF" />

    <!-- Outer Jagged Blue Lightning Aura -->
    <polygon points="124,32 104,12 68,15 41,5 54,16 16,14 41,27 10,32 41,37 16,50 54,48 41,59 68,49 104,52" fill="#0033CC" />
    
    <!-- Mid Cyan Spark/Discharge Layer -->
    <polygon points="119,32 100,16 72,18 50,11 60,19 28,19 47,29 23,32 47,35 28,45 60,45 50,53 72,46 100,48" fill="#00FFFF" />

    <!-- Plasma High-Voltage Core -->
    <use href="#electric-core-base" />

    <!-- Strange Dark Plasma/Energy Void -->
    <polygon points="113,32 96,22 74,22 54,16 65,25 42,27 58,32 42,35 65,37 54,46 74,42 96,42" fill="#1C0A35" />
    <polygon points="88,32 95,24.5 104,32 95,39.5" fill="#FFFF00" />
  </g>
</svg>
