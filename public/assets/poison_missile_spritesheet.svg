    <circle cx="8" cy="30" r="3" fill="#339900" />
    <circle cx="18" cy="19" r="2.5" fill="#66FF00" />
    <circle cx="24" cy="45" r="2" fill="#339900" />

    <!-- Outer Deep Acid Body (Bubbling, Shifting Liquid/Gas) -->
    <path d="M 122,32 C 122,17 98,11 72,13 C 56,10 46,6 56,16 C 40,15 32,20 48,27 C 22,25 12,32 44,35 C 24,38 28,48 48,46 C 36,54 52,58 68,52 C 98,54 122,47 122,32 Z" fill="#1A5E00" />
    
    <!-- Mid Neon Venom Layer -->
