<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 64" width="512" height="64">
  <defs>
    <!-- Reusable Core & Head Base -->
    <g id="core-base">
      <!-- Bright Leading Rim -->
      <path d="M 80,15 C 102,15 118,22 118,32 C 118,42 102,49 80,49 C 88,40 88,24 80,15 Z" fill="#FFCC00" />
    </g>
  </defs>

  <!-- ==================== FRAME 1 (0 to 128) ==================== -->
  <g transform="translate(0, 0)">
    <!-- Detached Trailing Embers -->
    <polygon points="8,30 18,28 14,33" fill="#FF3300" />
    <polygon points="16,18 24,16 20,21" fill="#FF6600" />
    <polygon points="22,45 32,43 26,48" fill="#FF3300" />

    <!-- Outer Red Flame Body -->
    <path d="M 122,32 C 122,17 98,10 72,12 L 52,8 L 62,16 L 28,15 L 48,25 L 14,32 L 48,39 L 26,49 L 62,48 L 52,56 L 72,52 C 98,54 122,47 122,32 Z" fill="#E62E00" />
    
    <!-- Mid Orange Flame -->
    <path d="M 118,32 C 118,20 96,14 74,16 L 60,14 L 68,20 L 42,21 L 58,28 L 32,32 L 58,36 L 42,43 L 68,44 L 60,50 L 74,48 C 96,50 118,44 118,32 Z" fill="#FF7700" />

    <!-- Yellow Energy Highlight -->
    <use href="#core-base" />

    <!-- Strange Dark Void Core -->
    <path d="M 112,32 C 112,24 94,20 78,22 L 62,19 L 72,26 L 48,27 L 66,32 L 48,37 L 72,38 L 62,45 L 78,42 C 94,44 112,40 112,32 Z" fill="#23081E" />
    <ellipse cx="98" cy="32" rx="8" ry="5" fill="#4A1238" />
  </g>

  <!-- ==================== FRAME 2 (128 to 256) ==================== -->
  <g transform="translate(128, 0)">
    <!-- Detached Trailing Embers (Shifted Left) -->
    <polygon points="4,26 12,24 9,29" fill="#FF3300" />
    <polygon points="12,42 22,40 16,45" fill="#FF6600" />
    <polygon points="24,14 34,13 28,17" fill="#FF3300" />

    <!-- Outer Red Flame Body -->
    <path d="M 122,32 C 122,18 98,11 72,13 L 46,6 L 58,15 L 22,19 L 44,27 L 20,32 L 44,37 L 20,45 L 58,49 L 46,58 L 72,51 C 98,53 122,46 122,32 Z" fill="#E62E00" />
    
    <!-- Mid Orange Flame -->
    <path d="M 118,32 C 118,21 96,15 74,17 L 56,12 L 65,19 L 36,23 L 54,29 L 38,32 L 54,35 L 36,41 L 65,45 L 56,52 L 74,47 C 96,49 118,43 118,32 Z" fill="#FF7700" />

    <!-- Yellow Energy Highlight -->
    <use href="#core-base" />

    <!-- Strange Dark Void Core -->
    <path d="M 112,32 C 112,23 94,19 78,21 L 58,17 L 70,25 L 52,29 L 62,32 L 52,35 L 70,39 L 58,47 L 78,43 C 94,45 112,41 112,32 Z" fill="#23081E" />
    <ellipse cx="96" cy="32" rx="9" ry="4" fill="#4A1238" />
  </g>

  <!-- ==================== FRAME 3 (256 to 384) ==================== -->
  <g transform="translate(256, 0)">
    <!-- Detached Trailing Embers -->
    <polygon points="6,36 16,34 11,39" fill="#FF3300" />
    <polygon points="15,12 23,11 19,15" fill="#FF3300" />
    <polygon points="18,48 28,46 23,51" fill="#FF6600" />

    <!-- Outer Red Flame Body -->
    <path d="M 122,32 C 122,16 98,9 72,11 L 56,9 L 64,17 L 32,13 L 50,24 L 10,32 L 50,40 L 32,51 L 64,47 L 56,55 L 72,53 C 98,55 122,48 122,32 Z" fill="#E62E00" />
    
    <!-- Mid Orange Flame -->
    <path d="M 118,32 C 118,19 96,13 74,15 L 62,15 L 70,21 L 46,19 L 60,27 L 26,32 L 60,37 L 46,45 L 70,43 L 62,49 L 74,49 C 96,51 118,45 118,32 Z" fill="#FF7700" />

    <!-- Yellow Energy Highlight -->
    <use href="#core-base" />

    <!-- Strange Dark Void Core -->
    <path d="M 112,32 C 112,25 94,21 78,23 L 64,21 L 74,27 L 44,26 L 68,32 L 44,38 L 74,37 L 64,43 L 78,41 C 94,43 112,39 112,32 Z" fill="#23081E" />
    <ellipse cx="99" cy="32" rx="7" ry="6" fill="#4A1238" />
  </g>

  <!-- ==================== FRAME 4 (384 to 512) ==================== -->
  <g transform="translate(384, 0)">
    <!-- Detached Trailing Embers -->
    <polygon points="5,19 14,17 10,22" fill="#FF6600" />
    <polygon points="10,49 18,47 14,52" fill="#FF3300" />
    <polygon points="20,28 30,26 25,31" fill="#FF3300" />

    <!-- Outer Red Flame Body -->
    <path d="M 122,32 C 122,17 98,10 72,12 L 49,7 L 60,16 L 25,17 L 46,26 L 18,32 L 46,38 L 25,47 L 60,48 L 49,57 L 72,52 C 98,54 122,47 122,32 Z" fill="#E62E00" />
    
    <!-- Mid Orange Flame -->
    <path d="M 118,32 C 118,20 96,14 74,16 L 58,13 L 66,20 L 39,22 L 56,28 L 35,32 L 56,36 L 39,42 L 66,44 L 58,51 L 74,48 C 96,50 118,44 118,32 Z" fill="#FF7700" />

    <!-- Yellow Energy Highlight -->
    <use href="#core-base" />

    <!-- Strange Dark Void Core -->
    <path d="M 112,32 C 112,24 94,20 78,22 L 60,18 L 71,26 L 50,28 L 64,32 L 50,36 L 71,38 L 60,46 L 78,42 C 94,44 112,40 112,32 Z" fill="#23081E" />
    <ellipse cx="97" cy="32" rx="8.5" ry="4.5" fill="#4A1238" />
  </g>
</svg>
